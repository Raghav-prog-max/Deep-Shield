name: Deep Shield CI

on:
  push:
    branches: [main, udbhav-branch]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU PyTorch, TorchVision & project requirements
        run: |
          pip install --no-cache-dir torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install --no-cache-dir -r requirements.txt pytest httpx
      - name: Download M01/M03 hustvl/yolos-tiny weights (26 MB)
        run: python scripts/download_m01_model.py
      - name: Run unit & integration test suite
        env:
          DEEPSHIELD_M02_BACKEND: stub
        run: pytest -v --ignore=tests/test_deep_models_media.py

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
